  /public/chat/v2/chat/tabular:
    post:
      tags:
        - chat
      summary: 送訊息（一次回完）
      description: |
        送一則訊息並等模型把整段回答產生完才回應。**要等的時間跟回答長度成正比**，長回答容易撞到連線逾時——想要逐段顯示請改用同名的 `:stream` 端點。

