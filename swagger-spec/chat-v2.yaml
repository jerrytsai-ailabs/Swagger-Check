openapi: 3.1.0
info:
  version: latest
  title: FedGPT Chat V2 API
  description: |
    跟 FedGPT 對話的 API。**一定要先建立對話（conversation），才能送訊息**——對話決定了要用哪個模型、哪種模式、以及模式要吃的資源（知識庫、FAQ、表格…）。

    ## 三步流程

    ### 1. 挑一個模型

    `GET /public/chat/v2/models` 拿到可用清單。**要填進對話的是 `id`，不是 `displayName`**——`displayName` 是給人看的。

    ### 2. 建立對話

    `POST /public/chat/v2/conversations`，帶 `mode`、`model`、以及該 mode 需要的 `params`。各 mode 的 `params` 規則見 `ConvParams`。回傳的 `convId` 是後續每次送訊息都要帶的。

    ### 3. 送訊息

    `POST /public/chat/v2/chat/{mode}`（一次回完）或 `POST /public/chat/v2/chat/{mode}:stream`（SSE 逐段回）。

    ⚠️ **路徑上的 mode 用 camelCase，但 `conversation.mode` 的值用 kebab-case。** 兩者不是同一種寫法：

    | 端點路徑 | 建立對話時要填的 `mode` |
    | --- | --- |
    | `/chat/normal` | `normal` |
    | `/chat/knowledge` | `knowledge` |
    | `/chat/agenticRag` | **`agentic-rag`** |
    | `/chat/faq` | `faq` |
    | `/chat/tabular` | `tabular` |

    照著路徑猜 mode 值（填成 `agenticRag`）會拿到 `400 data.validation: invalid conversation mode`。

    ## 五種模式的資源

    | mode | `params` 要填什麼 | 資源從哪查 |
    | --- | --- | --- |
    | `normal` | **必須留空** | — |
    | `knowledge` | 至少 1 個 knowledge ID | `GET /public/chat/v2/knowledges` |
    | `agentic-rag` | 至少 1 個 knowledge ID（與 `knowledge` 同一組規則） | 同上 |
    | `faq` | 至少 1 個 FAQ ID | `GET /public/chat/v2/faqs` |
    | `tabular` | **恰好 1 個** tabular ID | `GET /public/chat/v2/tabulars` |

    `params` 裡的每個 ID 都要有 `chat` 權限，缺任何一個就整個請求失敗（`403 auth.forbidden`，訊息會列出是哪幾個）。

    ## 本頁沒有的兩種模式

    `ConvMode` 還收 `agent` 與 `flow`，但**送訊息的端點不在這一頁**：

    - **`agent`** —— 對話在這裡建立，訊息要送到 Flowise V3 分頁的 `POST /chat/v2/chat/agent`（**沒有 `/public` 前綴**）。`params` 填恰好 1 個 agent ID；找不到 agent 時會再當成 flow ID 試一次。
    - **`flow`** —— 需要部署端開啟 `ENABLE_FLOW_MODE`（**預設關閉**），沒開會拿到 `400 data.validation: flow mode is not enabled`。`params` 填恰好 1 個 flow ID。**這個模式不驗證 `model`**，LLM 由 FedFlow 那邊決定。

    ## 串流

    `:stream` 版本以 `text/event-stream` 回應。事件格式、heartbeat、錯誤處理見 **SSE 串流** 分頁的「方言 A」——**特別注意串流一旦開始 HTTP status code 就固定是 200**，錯誤是以 `event: error` 送在串流裡。
servers:
  - description: API
    url: /api
security:
  - ApiKeyAuth: []
  - AccessToken: []
tags:
  - name: conversation
    description: 對話的建立、查詢、更新與刪除。送訊息之前一定要先有對話。
  - name: chat
    description: 送訊息。每個 mode 一條端點，各有一次回完與 `:stream` 兩種版本。
  - name: resource
    description: 查可用的模型與各模式要吃的資源（知識庫、FAQ、表格）。建立對話前用來取得要填進 `model` 與 `params` 的值。
paths:
  /public/chat/v2/conversations:
    get:
      tags:
        - conversation
      summary: 列出對話
      description: |
        列出你的對話，新的在前。**標題只回前 30 個字**，完整標題要打單一對話的端點。

        翻頁用 `cursor`：第一次不要帶，之後每次填上一頁回傳的 `nextCursor`；沒有 `nextCursor` 就代表沒有下一頁。
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 對話列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - conversations
                properties:
                  conversations:
                    type: array
                    description: |
                      這一頁的對話，不含訊息內容。
                    items:
                      $ref: '#/components/schemas/Conversation'
                  nextCursor:
                    type: string
                    description: |
                      下一頁的游標。**沒有這個欄位就代表已經是最後一頁。**
                    example: Ol5dPKnifWCkroZ0UjvvG
    post:
      tags:
        - conversation
      summary: 建立對話
      description: |
        建立一個對話。**送訊息之前一定要先做這一步**——`mode`、`model` 與 `params` 都在這裡決定，之後不能改。

        三件容易踩的事：

        1. **`mode` 用 kebab-case**，與端點路徑的 camelCase 不同（`agentic-rag` vs `/chat/agenticRag`）。
        2. **`model` 填 `GET /public/chat/v2/models` 回傳的 `id`**，不是 `displayName`。`flow` 以外的模式都必填。
        3. **`params` 的數量依 `mode` 而定**，而且裡面每個 ID 都要有 `chat` 權限——缺一個就整個請求失敗。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversation
              properties:
                conversation:
                  $ref: '#/components/schemas/ConversationCreate'
      responses:
        '200':
          description: 建立成功，回傳新對話的 ID
          content:
            application/json:
              schema:
                type: object
                required:
                  - conversation
                properties:
                  conversation:
                    type: object
                    required:
                      - convId
                    properties:
                      convId:
                        type: string
                        description: |
                          新對話的識別碼。後續送訊息都要帶它。
                        example: 3098643a-fd87-4c1b-bc45-c76d8d36a96a
        '400':
          description: |
            `mode` 不合法、`params` 數量不對、`model` 不存在，或用了不允許的模型（`reason` 為 `data.validation`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            `params` 裡有你沒有 `chat` 權限的資源（`reason` 為 `auth.forbidden`，`message` 會列出是哪幾個 ID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            `params` 裡有不存在的資源 ID（`reason` 為 `data.not-found`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/chat/v2/conversations/{convId}:
    get:
      tags:
        - conversation
      summary: 取得單一對話
      description: |
        取得一個對話的中介資料，**含完整標題**（列表端點只回前 30 個字）。訊息內容要另外打 `/messages`。
      parameters:
        - $ref: '#/components/parameters/convId'
      responses:
        '200':
          description: 對話的中介資料
          content:
            application/json:
              schema:
                type: object
                required:
                  - conversation
                properties:
                  conversation:
                    $ref: '#/components/schemas/Conversation'
        '404':
          description: |
            對話不存在（`reason` 為 `data.not-found`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - conversation
      summary: 更新對話標題
      description: |
        **只能改標題。** `mode`、`model`、`params` 建立後都不可變更——要換就開一個新對話。
      parameters:
        - $ref: '#/components/parameters/convId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversation
              properties:
                conversation:
                  $ref: '#/components/schemas/ConversationUpdate'
      responses:
        '200':
          description: 更新成功，回傳空物件
          content:
            application/json:
              schema:
                type: object
        '404':
          description: |
            對話不存在（`reason` 為 `data.not-found`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - conversation
      summary: 刪除對話
      description: |
        刪除一個對話**及其所有訊息**。無法復原。
      parameters:
        - $ref: '#/components/parameters/convId'
      responses:
        '200':
          description: 刪除成功，回傳空物件
          content:
            application/json:
              schema:
                type: object
        '404':
          description: |
            對話不存在（`reason` 為 `data.not-found`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/chat/v2/conversations/{convId}/messages:
    get:
      tags:
        - conversation
      summary: 列出對話中的訊息
      description: |
        取得一個對話的訊息。**預設新的在前**（`order` 預設 `-created_at`）。

        翻頁用 `cursor` 搭配 `nextCursor`。要往回翻的話，把 `prevCursor` 配上**相反的 `order`** 再打一次。

        **`flow` 模式的對話回的是另一組欄位**（`flowMessages`），見下方說明。
      parameters:
        - $ref: '#/components/parameters/convId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: 這一頁的訊息
          content:
            application/json:
              schema:
                type: object
                required:
                  - messages
                  - nextCursor
                  - prevCursor
                properties:
                  messages:
                    type: array
                    description: |
                      這一頁的訊息。**`flow` 模式的對話這裡會是空陣列**，內容改放在 `flowMessages`。
                    items:
                      $ref: '#/components/schemas/Message'
                  nextCursor:
                    type: string
                    description: |
                      下一頁的游標，沿用同一個 `order`。
                    example: Ol5dPKnifWCkroZ0UjvvG
                  prevCursor:
                    type: string
                    description: |
                      往回翻的游標。**要搭配相反的 `order` 使用**，否則會拿到同一頁。
                    example: dfd9f610bd644487af4a
                  flowMessages:
                    type: object
                    description: |
                      **只有 `flow` 模式的對話才有這個欄位**，裡面是 FedFlow 原生格式的訊息。有它的時候 `messages` 會是空的。
                    properties:
                      items:
                        type: array
                        description: |
                          FedFlow 格式的訊息。
                        items:
                          $ref: '#/components/schemas/ChatMessageResponse'
                      stream:
                        type: object
                        description: |
                          要接上的事件串流。

                          **「有沒有這個欄位」本身就是判斷依據**：沒有它就代表沒有串流可接，**不要**改從執行狀態或訊息歷史去推論。
                        properties:
                          streamId:
                            type: string
                            description: |
                              串流的識別碼。**內容不透明，不要解析**——開串流或送出輸入時原封當作 `streamId` 查詢參數帶回去。
                            example: 8K65Qr3rRxyv116m2CP0Z
                          taskId:
                            type: string
                            description: |
                              這次執行的工作編號，給人看的。
                            example: T000000229
                      lastRun:
                        type: object
                        description: |
                          訊息歷史最後那一次執行是怎麼結束的，**純粹給畫面用**——用來把「還沒人回應就被中斷的卡片」顯示成中斷而不是單純結束。

                          **不要拿它判斷要不要接串流**，那是 `stream` 欄位的事。對話歷史裡沒有任何執行時，這個欄位不會出現。
                        properties:
                          endedAbnormally:
                            type: boolean
                            description: |
                              `true` 代表那次執行是被中止、失敗或逾時結束的。
                            example: false
                  processingMessageId:
                    type: string
                    description: |
                      還在處理中的那則訊息的 ID。有值代表內容還會再更新，可以繼續輪詢或改接串流。
                    example: 50b3eae9-3ac7-417d-ac70-171b60d0554f
        '404':
          description: |
            對話不存在（`reason` 為 `data.not-found`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/chat/v2/chat/normal:
    post:
      tags:
        - chat
      summary: 送訊息（一次回完）
      description: |
        送一則訊息並等模型把整段回答產生完才回應。**要等的時間跟回答長度成正比**，長回答容易撞到連線逾時——想要逐段顯示請改用同名的 `:stream` 端點。

        路徑最後一段要對應對話建立時填的 `mode`（注意路徑是 camelCase、`mode` 值是 kebab-case，例如 `/chat/agenticRag` 對 `agentic-rag`）。**打錯對應的端點不會報錯，但會用錯的模式回答。**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 這一輪產生的訊息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: |
            `convId` 不存在、對話已停用，或 `message` 不合法（`reason` 為 `data.validation`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            沒有這個對話所引用資源的 `chat` 權限（`reason` 為 `auth.forbidden`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/chat/v2/chat/knowledge:
    post:
      tags:
        - chat
      summary: 送訊息（一次回完）
      description: |
        送一則訊息並等模型把整段回答產生完才回應。**要等的時間跟回答長度成正比**，長回答容易撞到連線逾時——想要逐段顯示請改用同名的 `:stream` 端點。

        路徑最後一段要對應對話建立時填的 `mode`（注意路徑是 camelCase、`mode` 值是 kebab-case，例如 `/chat/agenticRag` 對 `agentic-rag`）。**打錯對應的端點不會報錯，但會用錯的模式回答。**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 這一輪產生的訊息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: |
            `convId` 不存在、對話已停用，或 `message` 不合法（`reason` 為 `data.validation`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            沒有這個對話所引用資源的 `chat` 權限（`reason` 為 `auth.forbidden`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/chat/v2/chat/agenticRag:
    post:
      tags:
        - chat
      summary: 送訊息（一次回完）
      description: |
        送一則訊息並等模型把整段回答產生完才回應。**要等的時間跟回答長度成正比**，長回答容易撞到連線逾時——想要逐段顯示請改用同名的 `:stream` 端點。

        路徑最後一段要對應對話建立時填的 `mode`（注意路徑是 camelCase、`mode` 值是 kebab-case，例如 `/chat/agenticRag` 對 `agentic-rag`）。**打錯對應的端點不會報錯，但會用錯的模式回答。**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 這一輪產生的訊息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: |
            `convId` 不存在、對話已停用，或 `message` 不合法（`reason` 為 `data.validation`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            沒有這個對話所引用資源的 `chat` 權限（`reason` 為 `auth.forbidden`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /public/chat/v2/chat/faq:
    post:
      tags:
        - chat
      summary: 送訊息（一次回完）
      description: |
        送一則訊息並等模型把整段回答產生完才回應。**要等的時間跟回答長度成正比**，長回答容易撞到連線逾時——想要逐段顯示請改用同名的 `:stream` 端點。

        路徑最後一段要對應對話建立時填的 `mode`（注意路徑是 camelCase、`mode` 值是 kebab-case，例如 `/chat/agenticRag` 對 `agentic-rag`）。**打錯對應的端點不會報錯，但會用錯的模式回答。**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 這一輪產生的訊息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: |
            `convId` 不存在、對話已停用，或 `message` 不合法（`reason` 為 `data.validation`）
          content:
