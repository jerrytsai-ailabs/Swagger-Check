  /public/chat/v2/models:
    get:
      tags:
        - resource
      summary: 列出可用的模型
      description: |
        列出目前上線可用的模型。**建立對話前先打這一支**——`conversation.model` 只接受這裡回傳的 `id`。

        清單會隨部署的模型異動，不要寫死在程式裡。
      responses:
        '200':
          description: 可用的模型清單
          content:
