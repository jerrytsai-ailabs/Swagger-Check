              schema:
                type: object
                required:
                  - models
                properties:
                  models:
                    type: array
                    description: |
                      可用的模型。`type: lora` 的自訂模型**只能用在 `normal` mode**。
                    items:
                      $ref: '#/components/schemas/Model'
  /public/chat/v2/knowledges:
    get:
      tags:
        - resource
      summary: 列出可用的知識庫
