              schema:
                $ref: '#/components/schemas/Error'
  /public/chat/v2/chat/normal:stream:
    post:
      tags:
        - chat
      summary: 送訊息（串流）
      description: |
        與同名的非串流端點做同一件事，但以 SSE 逐段回傳，適合要即時顯示打字效果的介面。

        每一則 `event: data` 帶一個 `ChatResponse`，內容會隨著模型產生而增長。**注意 `overwrite`**：為 `true` 時代表這一份要取代先前同 `messageId` 的訊息，而不是接在後面。

        ⚠️ **串流一旦開始，HTTP status code 就固定是 `200`。** 中途失敗是以 `event: error` 送在串流裡，不會反映在 status code 上。事件格式、heartbeat 與錯誤處理見 **SSE 串流** 分頁的「方言 A」。

        下面標的 `4xx` 只會發生在**串流開始之前**（例如 `convId` 不存在）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: |
            SSE 串流。每則 `event: data` 帶一個 `ChatResponse`；失敗時最後一則是 `event: error`，帶 `Error` 物件。
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: |
            串流開始前就失敗：`convId` 不存在、對話已停用，或 `message` 不合法
          content:
            application/json:
